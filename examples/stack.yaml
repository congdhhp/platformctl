schema: 1

platform:
  root: /opt/platform

services:
  # Flat layout: /opt/softA/2.5.5-build184
  softA:
    version: 2.5.5-build184
    root: /opt/softA
    unit: softA.service
    state: running
    autostart: true

  # Default flat layout: /opt/platform/softB/3.1.0-build73
  softB:
    version: 3.1.0-build73
    unit: softB.service
    state: running
    autostart: true

  softC:
    version: 1.8.7-build52
    unit: softC.service
    state: running
    autostart: true

  # Existing vendor installation: platformctl controls only systemd state.
  # No symlink updates, version switching or rollback for this service.
  legacyApp:
    version: 3.1.0
    install_path: /opt/vendor/legacyApp
    unit: legacyApp.service
    state: running
    autostart: true
