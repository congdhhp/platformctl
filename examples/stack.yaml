schema: 1

platform:
  root: /opt/platform
  # Optional shared artifact base (HTTP(S) URL or local directory)
  source: http://nexus.lan:8081/repository/native-releases/

services:
  # Flat layout: /opt/softA/2.5.5-build184
  softA:
    version: 2.5.5-build184
    root: /opt/softA
    # Relative source uses platform.source
    source: softA/
    service_name: softA.service
    service_file: ./softA.service
    state: running
    autostart: true

  # Default flat layout: /opt/platform/softB/3.1.0-build73
  softB:
    version: 3.1.0-build73
    # Optional direct .deb relative to the global source
    source: softB/3.1.0-build73/softB.deb
    service_name: softB.service
    state: running
    autostart: true

  # Omitted source means a pre-deployed release, even if platform.source exists.
  softC:
    version: 1.8.7-build52
    service_name: softC.service
    state: running
    autostart: true

  # Existing vendor installation: platformctl controls only systemd state.
  # No symlink updates, version switching or rollback for this service.
  legacyApp:
    version: 3.1.0
    install_path: /opt/vendor/legacyApp
    service_name: legacyApp.service
    state: running
    autostart: true

  # Desktop GUI: no systemd unit; new launches follow /opt/BriefcaseSoftware/current
  briefcase:
    type: desktop
    version: 1.2.0
    root: /opt/BriefcaseSoftware
    source: briefcase/
    desktop_file: ./briefcase.desktop
